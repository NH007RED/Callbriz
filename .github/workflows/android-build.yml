name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build settings
        run: |
          BT=debug
          if [ -f .github/nh-build.env ]; then
            v=$(grep -E '^BUILD_TYPE=' .github/nh-build.env | head -1 | cut -d= -f2 | tr -d '\r ')
            if [ "$v" = "release" ]; then BT=release; fi
            if [ "$v" = "aab" ]; then BT=aab; fi
          fi
          echo "BUILD_TYPE=$BT" >> "$GITHUB_ENV"
          if [ -f .github/nh-build.env ]; then
            grep -E '^ENV_' .github/nh-build.env | tr -d '\r' | sed 's/^ENV_//' >> "$GITHUB_ENV" || true
          fi
          echo "Build type: $BT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          if [ "$BUILD_TYPE" = "aab" ]; then TASK=bundleRelease; elif [ "$BUILD_TYPE" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew "$TASK" --stacktrace
          else
            gradle "$TASK" --stacktrace
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          if [ "$BUILD_TYPE" = "aab" ]; then
            find . -path "*/build/outputs/bundle/release/*" -name "*.aab" -exec cp {} dist/ \;
          elif [ "$BUILD_TYPE" = "release" ]; then
            find . -path "*/build/outputs/apk/release/*" -name "*.apk" -exec cp {} dist/ \;
          else
            find . -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} dist/ \;
          fi
          ls -la dist

      - name: Sign release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'aab'
        run: |
          BT_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -f .github/nh-release.jks ]; then
            KS=".github/nh-release.jks"
            export KS_ALIAS=$(grep -E '^KS_ALIAS=' .github/nh-build.env | head -1 | cut -d= -f2- | tr -d '\r')
            export KS_PASS=$(grep -E '^KS_PASS=' .github/nh-build.env | head -1 | cut -d= -f2- | tr -d '\r')
            export KEY_PASS=$(grep -E '^KEY_PASS=' .github/nh-build.env | head -1 | cut -d= -f2- | tr -d '\r')
            echo "Using your keystore (alias: $KS_ALIAS)"
          else
            KS="$RUNNER_TEMP/release.jks"
            export KS_ALIAS=nhrelease
            export KS_PASS=android123
            export KEY_PASS=android123
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NH Developer, O=NH, C=IN"
            echo "No keystore given: signing with a temporary test key"
          fi
          for apk in dist/*.apk; do
            case "$apk" in
              *unsigned*)
                base=$(basename "$apk" .apk)
                base=${base%-unsigned}
                "$BT_DIR/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
                "$BT_DIR/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS \
                  --key-pass env:KEY_PASS --ks-key-alias "$KS_ALIAS" \
                  --out "dist/${base}-signed.apk" "$RUNNER_TEMP/aligned.apk"
                rm -f "$apk"
                ;;
            esac
          done
          for aab in dist/*.aab; do
            [ -f "$aab" ] || continue
            if unzip -l "$aab" | grep -qiE 'META-INF/[^/]+\.(RSA|DSA|EC)'; then
              echo "AAB already signed by project: $aab"
            else
              jarsigner -keystore "$KS" -storepass:env KS_PASS -keypass:env KEY_PASS \
                -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$KS_ALIAS"
              echo "AAB signed: $aab"
            fi
          done
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

      - name: Publish release (direct APK download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: |
            dist/*.apk
            dist/*.aab
